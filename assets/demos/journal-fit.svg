<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <rect width="720" height="400" fill="#f8fafc"/>
  <text x="24" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Journal Fit</text>
  <text x="24" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">Your Discussion → Nature Communications profile</text>
  <rect x="24" y="84" width="672" height="240" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15">
    <text x="48" y="120" fill="#0f172a">Claim density</text><text x="300" y="120" fill="#0f172a" font-weight="700">0.82</text><text x="360" y="120" fill="#16a34a">✓</text>
    <text x="48" y="152" fill="#0f172a">Citation density</text><text x="300" y="152" fill="#0f172a" font-weight="700">0.41</text><text x="360" y="152" fill="#16a34a">✓</text>
    <text x="48" y="184" fill="#0f172a">Hedging</text><text x="300" y="184" fill="#0f172a" font-weight="700">0.73</text><text x="360" y="184" fill="#d97706">⚠</text>
    <text x="48" y="216" fill="#0f172a">Rhetorical moves</text><text x="300" y="216" fill="#0f172a" font-weight="700">6/8</text><text x="360" y="216" fill="#16a34a">✓</text>
    <text x="48" y="248" fill="#0f172a">Move order</text><text x="300" y="248" fill="#0f172a" font-weight="700">78%</text><text x="360" y="248" fill="#d97706">⚠</text>
  </g>
  <text x="48" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Profile distilled from representative target-journal papers · zero LLM</text>
  <text x="24" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a">Not “write like a paper” — write like the journal you are targeting.</text>
